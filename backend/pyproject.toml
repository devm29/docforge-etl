[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "docforge"
version = "0.1.0"
description = "Incremental document-intelligence ETL: parse, chunk, embed and extract typed records with page-level provenance."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.162",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.14",
  "pydantic-settings>=2.16",
  "sqlalchemy[asyncio]>=2.1",
  "asyncpg>=0.32",
  "alembic>=1.20",
  "pgvector>=0.5",
  "arq>=0.28",
  "redis>=5.3",
  "pdfplumber>=0.11.10",
  "python-docx>=1.2",
  "openpyxl>=3.1.5",
  "anthropic>=2.6",
  "aioboto3>=15.5",
  "pyarrow>=26.0",
  "structlog>=26.1",
  "fpdf2>=2.9",
]

[project.optional-dependencies]
fastembed = ["fastembed>=0.4"]
dev = [
  "pytest>=9.2",
  "httpx>=0.28",
  "pytest-asyncio>=1.4",
  "mypy>=2.4",
  "ruff>=0.17",
  "moto[server]>=5.2",
  "boto3>=1.40",
]

[project.scripts]
docforge = "docforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docforge"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "ASYNC", "PTH", "C4", "PIE", "RET", "TID"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"src/docforge/corpus/generator.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["docforge"]
warn_unreachable = true

[[tool.mypy.overrides]]
# These libraries ship without type information.
module = ["asyncpg.*", "pdfplumber.*", "docx.*", "openpyxl.*", "aioboto3.*", "arq.*", "fastembed.*", "pgvector.*", "fpdf.*", "pyarrow.*", "moto.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs a running PostgreSQL with pgvector"]
filterwarnings = ["ignore::DeprecationWarning:pdfminer.*"]
