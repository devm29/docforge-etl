[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "docforge"
version = "0.1.0"
description = "Incremental document-intelligence ETL: parse, chunk, embed and extract typed records with page-level provenance."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pgvector>=0.3.6",
  "arq>=0.26",
  "redis>=5.0",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "anthropic>=1.0",
  "aioboto3>=13.0",
  "pyarrow>=18.0",
  "structlog>=24.4",
  "httpx>=0.27",
  "fpdf2>=2.8",
]

[project.optional-dependencies]
fastembed = ["fastembed>=0.4"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "mypy>=1.13",
  "ruff>=0.8",
  "moto[server]>=5.0",
  "boto3>=1.35",
]

[project.scripts]
docforge = "docforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docforge"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "ASYNC", "PTH", "C4", "PIE", "RET", "TID"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"src/docforge/corpus/generator.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["docforge"]
warn_unreachable = true

[[tool.mypy.overrides]]
# These libraries ship without type information.
module = ["asyncpg.*", "pdfplumber.*", "docx.*", "openpyxl.*", "aioboto3.*", "arq.*", "fastembed.*", "pgvector.*", "fpdf.*", "pyarrow.*", "moto.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs a running PostgreSQL with pgvector"]
filterwarnings = ["ignore::DeprecationWarning:pdfminer.*"]
