name: docforge

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &backend-env
    DATABASE_URL: postgresql+asyncpg://docforge:docforge@postgres:5432/docforge
    REDIS_URL: redis://:${REDIS_PASSWORD:-docforge-dev}@redis:6379/0
    CORS_ORIGINS: '["http://localhost:3103"]'
    API_TOKENS: '{"${DOCFORGE_API_TOKEN:-change-me-local-token}": "${DOCFORGE_REVIEWER:-reviewer}"}'
    LOG_JSON: "true"
    LLM_PROVIDER: ${LLM_PROVIDER:-auto}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    EXTRACTION_MODEL: ${EXTRACTION_MODEL:-claude-opus-5-5}
    S3_ENDPOINT_URL: http://minio:9000
    S3_BUCKET: docforge-inbox
    S3_ACCESS_KEY_ID: docforge
    S3_SECRET_ACCESS_KEY: docforge-secret
  volumes:
    - docforge-data:/data
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docforge
      POSTGRES_PASSWORD: docforge
      POSTGRES_DB: docforge
    ports:
      - "127.0.0.1:5503:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docforge -d docforge"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-docforge-dev}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-docforge-dev}", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6403:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: docforge
      MINIO_ROOT_PASSWORD: docforge-secret
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-seed:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./sample-corpus:/corpus:ro
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 docforge docforge-secret &&
             mc mb --ignore-existing local/docforge-inbox &&
             mc mirror --overwrite /corpus local/docforge-inbox"
    restart: "no"

  api:
    <<: *backend
    ports:
      - "127.0.0.1:8103:8103"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8103/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    <<: *backend
    command: ["arq", "docforge.worker.main.WorkerSettings"]
    environment:
      <<: *backend-env
      SCHEDULED_SCAN_ENABLED: "true"
    depends_on:
      api:
        condition: service_healthy

  seed:
    <<: *backend
    command: ["docforge", "seed", "--yes"]
    profiles: ["seed"]
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./web
    environment:
      DOCFORGE_API_ORIGIN: http://api:8103
      DOCFORGE_API_TOKEN: ${DOCFORGE_API_TOKEN:-change-me-local-token}
    ports:
      - "127.0.0.1:3103:3103"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
  docforge-data:
