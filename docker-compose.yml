name: docforge

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &backend-env
    DATABASE_URL: postgresql+asyncpg://docforge:docforge@postgres:5432/docforge
    REDIS_URL: redis://:${REDIS_PASSWORD:-docforge-dev}@redis:6379/0
    CORS_ORIGINS: '["http://localhost:3103"]'
    API_TOKENS: '{"${DOCFORGE_API_TOKEN:-change-me-local-token}": "${DOCFORGE_REVIEWER:-reviewer}"}'
    LOG_JSON: "true"
    LLM_PROVIDER: ${LLM_PROVIDER:-auto}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    EXTRACTION_MODEL: ${EXTRACTION_MODEL:-claude-opus-5-5}
    # Local S3 stand-in (moto). These are throwaway dev credentials, not real AWS keys.
    S3_ENDPOINT_URL: http://s3:5000
    S3_BUCKET: docforge-inbox
    S3_ACCESS_KEY_ID: docforge
    S3_SECRET_ACCESS_KEY: docforge-secret
  volumes:
    - docforge-data:/data
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    s3-seed:
      condition: service_completed_successfully

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docforge
      POSTGRES_PASSWORD: docforge
      POSTGRES_DB: docforge
    ports:
      - "127.0.0.1:5503:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docforge -d docforge"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-docforge-dev}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-docforge-dev}", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6403:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    # In-memory S3 API (moto). The bucket is recreated by s3-seed whenever the stack starts.
    image: motoserver/moto:5.2.5
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/moto-api/"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3-seed:
    image: amazon/aws-cli:2.39.6
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: docforge
      AWS_SECRET_ACCESS_KEY: docforge-secret
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./sample-corpus:/corpus:ro
    entrypoint: ["sh", "-c"]
    command:
      - >-
        aws --endpoint-url http://s3:5000 s3 mb s3://docforge-inbox 2>/dev/null;
        aws --endpoint-url http://s3:5000 s3 sync --only-show-errors /corpus s3://docforge-inbox
    restart: "no"

  api:
    <<: *backend
    ports:
      - "127.0.0.1:8103:8103"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8103/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    <<: *backend
    command: ["arq", "docforge.worker.main.WorkerSettings"]
    environment:
      <<: *backend-env
      SCHEDULED_SCAN_ENABLED: "true"
    depends_on:
      api:
        condition: service_healthy

  seed:
    <<: *backend
    command: ["docforge", "seed", "--yes"]
    profiles: ["seed"]
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./web
    environment:
      DOCFORGE_API_ORIGIN: http://api:8103
      DOCFORGE_API_TOKEN: ${DOCFORGE_API_TOKEN:-change-me-local-token}
    ports:
      - "127.0.0.1:3103:3103"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  docforge-data:
